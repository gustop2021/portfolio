<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Portifolio - [Le Shorne] </title>
        <link rel="stylesheet" href="style.css"/>
    </head>
    <body>
        <main>
            <div id="container-artista">
                <img src="assets/imagens/artista.png" usemap="#mapa-corpo" id="imagem-artista" alt="Artista" />
                <map name="mapa-corpo">
                <!-- As áreas clicáveis virão aqui -->
            </map>
            </div>
            <div id="container-abas">
                <section id="sobre">
                    <h2>sobre mim</h2>
                    <p>Eu sou a Le Shorne</p>
                </section>
                <section id="redes">
                    <h2>Como me achar</h2>
                    <p>Essas são minhas redes</p>
                </section>
                <section id="amigos">
                    <h2>amo meus amigos</h2>
                    <p>olha meus amigos</p>
                </section>
                <section id="diversao">
                    <h2>amo me divertir</h2>
                    <p>como me divirto</p>
                </section>
            </div>
        </main>
        <script src="script.js"></script>
    </body>
</html>
